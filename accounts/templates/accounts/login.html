{% extends 'base.html' %}
{% load static %}

{% block title %}Login — NOVA PT{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="container">
        <div class="auth-container fade-up">
            <div class="text-center mb-4">
                <img src="{% static 'images/logo.png' %}" alt="NOVA PT" height="48" style="opacity:0.85;">
            </div>
            <div class="card">
                <div class="card-header bg-teal text-center">
                    <h3 class="mb-0">Welcome Back</h3>
                </div>
                <div class="card-body p-4">
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold">Username</label>
                            <input type="text" name="username" id="username" class="form-control" placeholder="Enter your username" required>
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold">Password</label>
                            <input type="password" name="password" id="password" class="form-control" placeholder="Enter your password" required>
                        </div>
                        <button type="submit" class="btn btn-teal w-100 py-2">Log In</button>
                    </form>
                    <p class="text-center mt-4 mb-0" style="font-size:0.92rem;">
                        Don't have an account? <a href="{% url 'accounts:signup' %}" class="text-teal fw-semibold text-decoration-none">Sign up</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
