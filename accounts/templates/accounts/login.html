{% extends 'base.html' %}

{% block title %}Login — NOVA PT{% endblock %}

{% block content %}
<div class="container auth-container">
    <div class="card">
        <div class="card-header bg-teal text-center">
            <h3 class="mb-0">Welcome Back</h3>
        </div>
        <div class="card-body p-4">
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="username" class="form-label fw-semibold">Username</label>
                    <input type="text" name="username" id="username" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label fw-semibold">Password</label>
                    <input type="password" name="password" id="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-teal w-100 py-2">Log In</button>
            </form>
            <p class="text-center mt-3 mb-0">
                Don't have an account? <a href="{% url 'accounts:signup' %}" class="text-teal">Sign up</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
